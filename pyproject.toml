[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git4subeditor"
version = "0.1.0"
description = "Convert Barotrauma .sub submarine files into Git-friendly text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
keywords = ["barotrauma", "submarine", "git", "modding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
git4subeditor = "git4subeditor.cli:main"
sub-unpack = "git4subeditor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/git4subeditor"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
