[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "git4subeditor"
version = "0.1.22"
description = "Convert Barotrauma .sub files into a text format suitable for Git version tracking"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["prompt_toolkit>=3.0"]
keywords = ["barotrauma", "barotrauma-modding", "barotrauma-tools", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
authors = [{ name = "Yinjie" }]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
git4subeditor = "git4subeditor.cli:main"

[project.urls]
Homepage = "https://github.com/Yinjie1/Git4SubEditor"
Repository = "https://github.com/Yinjie1/Git4SubEditor"
Issues = "https://github.com/Yinjie1/Git4SubEditor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
