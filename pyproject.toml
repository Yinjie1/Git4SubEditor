[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "git4subeditor"
version = "0.1.20"
description = "Convert Barotrauma .sub submarine files into Git-friendly text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["prompt_toolkit>=3.0"]
keywords = ["barotrauma", "submarine", "git", "modding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
git4subeditor = "git4subeditor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
